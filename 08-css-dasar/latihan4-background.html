<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Latihan 4 Background</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap");
      body {
        width: 100%;
        min-height: 100vh;
        padding-top: 50px;
        margin: auto;
        background-image: url(img/px-bg2.jpg);
        background-repeat: no-repeat;
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        text-align: center;
        overflow: hidden;
      }

      h1 {
        font-size: 4em;
        font-family: "Courier New", Courier, monospace;
        font-weight: 700;
        letter-spacing: 20px;
        /*color: rgb(221, 147, 11);*/
        color: transparent;
        background-image: linear-gradient(
          to right,
          rgb(255, 23, 23) 40%,
          rgb(255, 179, 16) 60%
        );
        background-clip: text;
        /*text-shadow: 4px 4px 10px #f0f0f0;*/
        filter: drop-shadow(0 0 10px rgba(87, 216, 255, 0.856));
      }

      .content {
        width: 600px;
        margin: auto;
        font-size: 1.7rem;
        font-family: "Montserrat", system-ui;
        font-weight: 500;
        line-height: 1.5;
        border-radius: 20px;
        border: 2px solid rgb(255 255 255 / 10%);
        box-shadow: 3px 3px 10px rgba(0, 0, 0, 0.836);
        background-color: #b4b4b450;
      }
      span {
        color: crimson;
        text-decoration: none;
        text-shadow: 0 0 10px rgba(255, 81, 116, 0.7);
      }

      .credit {
        font-size: 20px;
        font-family: "Montserrat", Courier, monospace;
        font-weight: 700;
        letter-spacing: 5px;
        border-top: 2px solid rgb(255 255 255 / 60%);
        width: 30%;
        margin: 20px auto;
      }
    </style>
  </head>
  <body>
    <h1>FASE RUNTUH</h1>
    <div class="content">
      <p>
        <q>
          Tak perlu khawatir, ku hanya <span>terluka</span>. <br />
          Terbiasa tuk pura-pura tertawa. Namun bolehkah sekali saja ku
          menangis? Sebelum kembali membohongi diri.
        </q>
      </p>
    </div>
    <div class="credit">
      <p>~ FEBY PUTRI FEAT. FIERSA BESARI</p>
    </div>
  </body>
</html>
