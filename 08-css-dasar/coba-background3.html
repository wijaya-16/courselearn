<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>coba background 3</title>
  </head>
  <style>
    body {
      background-color: #008fbb;
      /*background-image: linear-gradient(salmon, green, yellow, aquamarine);*/
      background-image: linear-gradient(to bottom, salmon, aquamarine 100%);
      height: 100vh;
    }

    .kotak1 {
      width: 200px;
      height: 200px;
      background-color: salmon;
      background-image: linear-gradient(to right, red, blue);
    }
    .kotak2 {
      width: 200px;
      height: 200px;
      background-color: salmon;
      background-image: radial-gradient(rgb(4, 0, 255), green);
    }
    .kotak3 {
      width: 200px;
      height: 200px;
      background-color: salmon;
      background-image: conic-gradient(gold, blue);
    }
  </style>
  <body>
    <div class="kotak1"></div>
    <div class="kotak2"></div>
    <div class="kotak3"></div>
  </body>
</html>
