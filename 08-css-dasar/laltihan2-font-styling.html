<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Latihan-2 Font Styling</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Creepster&family=Indie+Flower&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap");
      h1 {
        font-size: 50px;
        text-align: center;
        font-family: "Creepster", system-ui;
        font-weight: 200;
        text-transform: uppercase;
        font-style: italic;
        letter-spacing: 15px;
        text-decoration: underline;
        text-decoration-style: wavy;
        text-decoration-color: gray;
        text-decoration-skip-ink: none;
        text-shadow: 5px 5px 5px rgb(165, 165, 165);
      }

      p {
        font-size: 30px;
        text-align: center;
        line-height: 90px;
        word-spacing: 10px;
        font-family: Cambria, Cochin, Georgia, Times, "Times New Roman", serif;
      }

      span {
        color: gray;
        text-decoration: line-through;
      }

      .credit {
        font-size: 20px;
        letter-spacing: 5px;
        color: rgb(201, 201, 201);
      }
    </style>
  </head>
  <body>
    <h1>Fase Runtuh</h1>

    <p>
      <q>
        Tak Perlu khawatir, ku hanya <span>terluka</span>. <br />
        Terbiasa tuk pura-pura tertawa. <br />
        Namun bolehkan sekali saja ku menangis? <br />
        sebelum kembali membohongi diri.
      </q>
    </p>
    <p class="credit">~feby putri feat. fiersa besari</p>
  </body>
</html>
