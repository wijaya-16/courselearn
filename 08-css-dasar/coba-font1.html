<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coba CSS - Font Styling</title>
    <style>
      h1 {
        color: crimson;
        font-size: 60px;
        text-align: center;
        font-family: "comic sans MS", sans-serif;
      }

      p {
        font-size: 30px;
        color: coral;
        font-family: Arial, Helvetica, sans-serif;
      }
    </style>
  </head>
  <body>
    <h1>Hallo Dunia</h1>
    <p>
      Lorem ipsum dolor sit amet consectetur adipisicing elit. Iure voluptates
      quaerat molestiae esse iste error reiciendis soluta ipsum dolores voluptas
      placeat veritatis sint, adipisci, architecto, excepturi sed velit.
      Adipisci, eligendi!
    </p>
  </body>
</html>
