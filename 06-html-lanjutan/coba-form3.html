<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Select & Textarea</title>
  </head>
  <body>
    <h2>Universitas Teknologi Mataram</h2>
    <p>
      Lorem ipsum dolor sit amet, consectetur adipisicing elit. Sint porro
      aperiam repellat distinctio quo ad tempore praesentium fugiat numquam rem.
    </p>
    <form>
      <h4>Pilih Jurusan Anda</h4>

      <!-- select -->
      <select name="jurusan" id="jurusan">
        <option value="">-- Pilih Jurusan Anda --</option>
        <option value="ti">Teknik Informatika</option>
        <option value="si">Sistem Informasi</option>
        <option value="tf">Teknik Informasi</option>
        <option value="rsk">Rekayasa Sistem Komputer</option>
        <option value="mnj">Manajemen</option>
        <option value="mnjex">Manajemen Eksekutif</option>
      </select>
      <br /><br />

      <h4>Tentang Kampus:</h4>
      <!-- textarea -->
      <textarea
        name="article"
        id="article"
        cols="50"
        rows="20"
        placeholder="Ceritakan Tentang Kampus Disini..."
      >
      </textarea>
      <br /><br />
    </form>
  </body>
</html>
