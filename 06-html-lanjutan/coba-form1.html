<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coba Element Form</title>
  </head>
  <body>
    <h1>Contoh elemen-elemen form pada HTML</h1>

    <form>
      <label for="nama"> Nama: </label>
      <input
        type="text"
        name="nama"
        id="nama"
        placeholder="Masukkan nama Anda"
      />

      <br />
      <br />
      <label for="password">Password: </label>
      <input type="password" name="password" id="password" />
      <br />
      <br />

      <label for="email">Email:</label>
      <input type="email" name="email" id="email" />

      <br />
      <br />

      <label for="number">Angka:</label>
      <input
        type="number"
        name="number"
        id="number"
        min="0"
        max="10"
        step="2"
      />
      <br />
      <br />

      <label for="date">
        Tanggal :
        <input type="date" id="date" name="date" />
      </label>
      <br />
      <br />

      <label for="bulan"
        >bulan:
        <input type="month" id="" name="" />
      </label>
      <br />
      <br />
      <label for="date-time-local"
        >Date Time Local :
        <input type="datetime-local" id="" name="" />
      </label>

      <br />
      <br />
      <label for="warna">
        Warna:
        <input type="color" id="" name="" />
      </label>
      <br />
      <br />
      <label for="Cari"
        >Search :
        <input type="search" id="" name="" />
      </label>
      <br /><br />
      <label for="hidden"
        >Hidden :
        <input type="hidden" id="" name="" />
      </label>

      <br />
      <br />

      <label for="file"
        >File :
        <input type="file" id="" name="" />
      </label>
      <br />
      <br />
      <label for="range"
        >Range :
        <input type="range" id="" name="" />
      </label>

      <br />
      <br />

      <label for="radio">
        Radio Button :
        <input type="radio" id="" name="" />
        <input type="radio" id="" name="" />
      </label>

      <br />
      <br />

      <label for="image"
        >Image:
        <input type="image" id="" name="" />
      </label>
      <br />
      <br />
      <label for="tel"
        >Telpon :
        <input type="tel" id="" name="" max="15" />
      </label>
      <br />
      <br />
      <label for="url"
        >URL :
        <input type="url" id="" name="" />
      </label>
      <br />
      <br />
      <label for="text"
        >Text :
        <input type="text" id="" name="" max="15" />
      </label>
      <br />
      <br />
      <button type="submit">Kirim</button>
    </form>
  </body>
</html>
