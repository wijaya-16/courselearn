<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coba Box Model Margin & Padding</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      .kotak1 {
        background-color: lightblue;
        padding: 20px;
        line-height: 2;
      }

      ul li {
        list-style: none;
        display: inline-block;
        margin-left: 50px;
        margin: auto 50px;
        text-decoration: none;
      }

      a {
        font-family: Arial, Helvetica, sans-serif;
        font-weight: bolder;
        font-size: 1.5rem;
        text-decoration: none;
        border: none;
        transition: 0.2s;
      }

      a:hover {
        width: 100%;
        color: darksalmon;
        border-bottom: 5px solid #9e0000;
        transform: translate(100px, 100px);
      }

      .quote {
        font-size: 1.5rem;
        color: #333;
        font-family: Arial, Helvetica, sans-serif;
        font-weight: bold;
        text-align: left;
        line-height: 1;
      }

      .quote::before,
      .quote::after {
        content: "❝ ";
        color: #a05801;
        font-size: 2.1em;
      }
      .quote::after {
        content: " ❞";
      }

      .kotak2 {
        width: 500px;
        height: 150px;
        background-color: #0a8d8d;
        border-radius: 10px;
        box-shadow: 3px 3px 5px #333;
        cursor: pointer;
        transition: 0.2s;

        margin-top: 30px;
        margin-left: 1300px;

        /*Penerapan Padding*/
        padding: 20px;

        /*Penggunaan Border*/
        border: 5px dotted lime;
        outline: 10px solid crimson;
      }

      .kotak2:hover,
      :target {
        transform: scale(0.95);
        background-color: burlywood;
      }

      .kotak3 {
        width: 1250px;
        height: 100px;
        background-color: bisque;
        border-radius: 10px;
        text-align: center;
        transition: 0.3s;

        margin: 80px auto;

        /*Penerapan Padding*/
        padding: 20px;

        /* Penggunaan border dan outline*/
        border: 2px solid darkcyan;
        outline: 5px solid crimson;
      }

      .kotak3:hover {
        cursor: pointer;
        background-color: #a0c3f0e3;
        transform: scale(1.1);
        outline: 10px double crimson;
      }
    </style>
  </head>
  <body>
    <div class="kotak1">
      <ul>
        <li><a href="#home">Home</a></li>
        <li><a href="#about">About</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
    </div>
    <div class="kotak2">
      <p class="quote">
        Setiap bug adalah pelajaran yang sedang menunggu untuk dipahami.
      </p>
    </div>
    <div class="kotak3">
      <p class="quote">
        Programmer hebat bukan yang tidak pernah salah, tetapi yang terus
        memperbaiki kesalahannya.
      </p>
    </div>
  </body>
</html>
